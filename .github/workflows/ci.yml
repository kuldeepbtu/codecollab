name: CodeCollab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8, Vitest 5 and mongodb-memory-server 11 require modern Node.
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # npm ci installs the platform-specific optional native packages
      # consistently and fails if a lockfile is out of sync.
      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Run backend tests
        run: npm test --prefix backend
        env:
          JWT_SECRET: ci_test_secret_key_2026
          CLIENT_URL: http://localhost:5173
          USE_MEMORY_DB: "true"

      - name: Build frontend
        run: npm run build --prefix frontend
